name: Business Architect CI

on:
  push:
    branches: [business-architect-build]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '20.x'
      - run: npm install
      - run: npm run build
      - run: npx vitest run platform/business-architect/src/__tests__
