name: Business Architect CI

on:
  push:
    branches: [business-architect-build]
  workflow_dispatch:

jobs:
  full-build-baseline:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '20.x'
      - run: npm install
      - run: npm run build

  business-architect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '20.x'
      - run: npm install
      - run: npx vitest run platform/business-architect/src/__tests__
      - name: Check BA TypeScript errors only
        shell: bash
        run: |
          set +e
          npm run build > /tmp/aegis-build.log 2>&1
          status=$?
          if grep -E '(^|/)(platform/business-architect|apps/business-architect)/.*error TS|error TS.*(platform/business-architect|apps/business-architect)' /tmp/aegis-build.log; then
            echo "Business Architect TypeScript errors detected."
            exit 1
          fi
          echo "Root build exit code: $status"
          echo "No Business Architect TypeScript errors detected in the root build output."
          exit 0
