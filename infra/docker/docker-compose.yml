---
# infra/docker/docker-compose.yml
# Local development infrastructure only.
# Do NOT use this in production.

version: '3.9'

services:

  # ── Postgres with RLS extensions ─────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: platform-postgres
    environment:
      POSTGRES_DB:       platform_core
      POSTGRES_USER:     platform
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform_core"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: platform-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ── LocalStack (SQS + S3 + KMS) ───────────────────────────────
  localstack:
    image: localstack/localstack:3.3
    container_name: platform-localstack
    environment:
      SERVICES:    sqs,s3,kms
      DEBUG:       0
      DATA_DIR:    /tmp/localstack/data
      DOCKER_HOST: unix:///var/run/docker.sock
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/tmp/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      - ./localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/health | grep running"]
      interval: 15s
      timeout:  10s
      retries:  10

  # ── Vault (dev mode) ──────────────────────────────────────────
  vault:
    image: hashicorp/vault:1.15
    container_name: platform-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: changeme
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    command: vault server -dev
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://localhost:8200"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ── OpenTelemetry Collector ───────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.97.0
    container_name: platform-otel
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4318:4318"   # OTLP HTTP
      - "4317:4317"   # OTLP gRPC
      - "8888:8888"   # Metrics

  # ── Jaeger (traces) ───────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: platform-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # UI
      - "14317:14317"  # gRPC
    depends_on:
      - otel-collector

volumes:
  postgres_data:
  redis_data:
  localstack_data:

networks:
  default:
    name: platform-network
