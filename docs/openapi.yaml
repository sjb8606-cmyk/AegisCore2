# docs/openapi.yaml
# This file is generated by: npm run openapi
# Source: scripts/export-openapi.js
#
# To regenerate: make openapi

openapi: 3.1.0
info:
  title: platform-core API
  version: 1.0.0
  description: >
    Secure SaaS/AI Platform Foundation.
    Run `npm run openapi` to generate the full spec from route definitions.
servers:
  - url: https://api.example.com
    description: Production
  - url: http://localhost:3000
    description: Local Dev
security:
  - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Service is alive
  /ready:
    get:
      operationId: getReadiness
      summary: Readiness probe
      security: []
      responses:
        '200':
          description: Service is ready
        '503':
          description: Service not ready
  /api/items:
    get:
      operationId: listItems
      summary: List items (tenant-scoped, paginated)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Paginated items
        '401':
          description: Unauthorized
        '429':
          description: Rate limited
  /api/ai/validate:
    post:
      operationId: validateAiOutput
      summary: Validate LLM output against safety rules
      responses:
        '200':
          description: Validation result
        '401':
          description: Unauthorized
